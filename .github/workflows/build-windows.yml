name: Build Windows

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Wails
        shell: powershell
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Build Wails app
        shell: powershell
        run: |
          wails build -platform windows/amd64

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: build/bin/*.exe
